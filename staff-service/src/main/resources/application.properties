server.port=8081
spring.application.name=staff-service

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Config Server Configuration
spring.config.import=optional:configserver:http://localhost:8888

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medsync_hospital
spring.datasource.username=root
spring.datasource.password=Anil@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.medsync_hospital.staff_service=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/staff-service.log

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Request/Response Logging
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# SMS Configuration
sms.provider=twilio
sms.twilio.account-sid=your-twilio-account-sid
sms.twilio.auth-token=your-twilio-auth-token
sms.twilio.from-number=+1234567890
sms.fast2sms.api-key=your-fast2sms-api-key
sms.fast2sms.sender-id=TRADES
sms.fast2sms.api-url=https://www.fast2sms.com/dev/bulkV2
sms.fast2sms.route=t

# SMS Templates
sms.templates.otp=Your OTP for MedSync Hospital is: {otp}. Valid for 10 minutes. Do not share this with anyone.
sms.templates.appointment-reminder=Dear {patientName}, your appointment with Dr. {doctorName} is scheduled for {appointmentDate} at {appointmentTime}. Please arrive 15 minutes early.
sms.templates.claim-status=Your insurance claim #{claimNumber} status has been updated to {status}. For details, contact us at {hospitalPhone}.
sms.templates.registration-confirmation=Welcome to MedSync Hospital! Your registration is successful. Patient ID: {patientId}. Contact: {hospitalPhone}

# OTP Configuration
sms.otp.length=6
sms.otp.expiry-minutes=10
sms.otp.max-attempts=3
sms.otp.resend-interval-minutes=2

# Rate Limiting
sms.rate-limit.max-sms-per-hour=10
sms.rate-limit.max-sms-per-day=50

# Retry Configuration
sms.retry.max-attempts=3
sms.retry.initial-delay-seconds=1
sms.retry.max-delay-seconds=30

# Test Configuration
sms.test.enabled=false
sms.test.test-phone-numbers[0]=+919100784590
sms.test.mock-response=true 